# Exp 0 — Baseline clásico (bge-base-en-v1.5)
# BGE v1.5 de BAAI: mesma familia que bge-m3 (v3), versión anterior.
# 86M params, 768 dims, 512 tokens — sen truncación con chunks de 512.
exp0:
  experiment_id: "exp0_baseline"

  chunking:
    strategy: fixed_size
    chunk_size: 256          # tokens BERT (non caracteres)
    chunk_overlap: 25        # ~10% de 256
    tokenizer_model: "BAAI/bge-base-en-v1.5"

  embedding:
    model: "BAAI/bge-base-en-v1.5"
    batch_size: 32

  retrieval:
    strategy: cosine
    top_k: 5

  llm:
    model: "deepseek-v4-flash"
    temperature: 0.0
    max_tokens: 2048
    base_url: "https://api.deepseek.com"

  ragas_llm:
    model: "gemini-2.5-flash"
    temperature: 0.0
    max_tokens: 4096
    thinking_budget: 0

